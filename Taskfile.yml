version: '3'

tasks:
  build:
    desc: Build all crates
    cmds:
      - cargo build --workspace

  test:
    desc: Run all tests
    cmds:
      - cargo test --workspace

  test-harness:
    desc: Run test harness tests only
    cmds:
      - cargo test -p schizoid-test-harness

  check:
    desc: Check all crates compile
    cmds:
      - cargo check --workspace

  clippy:
    desc: Run clippy lints
    cmds:
      - cargo clippy --workspace -- -D warnings

  fmt:
    desc: Format all code
    cmds:
      - cargo fmt --all

  fmt-check:
    desc: Check formatting
    cmds:
      - cargo fmt --all -- --check

  server:
    desc: Run the game server
    cmds:
      - cargo run -p schizoid-server -- {{.CLI_ARGS}}

  client:
    desc: Run the game client
    cmds:
      - cargo run -p schizoid-client -- {{.CLI_ARGS}}

  lint:
    desc: Run all lints (fmt + clippy)
    cmds:
      - task: fmt-check
      - task: clippy

  ci:
    desc: Full CI check (fmt + clippy + test)
    cmds:
      - task: fmt-check
      - task: clippy
      - task: test

  play:
    desc: Build, then start server + client in the background
    cmds:
      - nix develop -c cargo build --workspace
      - |
        nix develop -c cargo run -p schizoid-server -- {{.CLI_ARGS}} &
        SERVER_PID=$!
        echo $SERVER_PID > /tmp/schizoid-server.pid
        echo "Server started (PID $SERVER_PID)"
        sleep 2
        nix develop -c cargo run -p schizoid-client -- {{.CLI_ARGS}} &
        CLIENT_PID=$!
        echo $CLIENT_PID > /tmp/schizoid-client.pid
        echo "Client started (PID $CLIENT_PID)"
        echo "Run 'task stop' to tear down"

  demo:
    desc: Unattended demo — server + two bot clients, screenshots + logs to .tmp/
    cmds:
      - nix develop -c cargo build --workspace
      - mkdir -p .tmp
      - |
        DURATION={{.DURATION | default 60}}
        nix develop -c cargo run -p schizoid-server > .tmp/demo-server.log 2>&1 &
        echo $! > /tmp/schizoid-server.pid
        echo "Server started (PID $(cat /tmp/schizoid-server.pid))"
        sleep 2
        nix develop -c cargo run -p schizoid-client -- --bot \
          --screenshot .tmp/demo-p1.png --screenshot-at 15 \
          --exit-after $DURATION > .tmp/demo-client1.log 2>&1 &
        echo $! > /tmp/schizoid-client.pid
        echo "Bot client 1 started (PID $(cat /tmp/schizoid-client.pid))"
        sleep 2
        nix develop -c cargo run -p schizoid-client -- --bot \
          --screenshot .tmp/demo-p2.png --screenshot-at 20 \
          --exit-after $DURATION > .tmp/demo-client2.log 2>&1 &
        echo $! > /tmp/schizoid-client2.pid
        echo "Bot client 2 started (PID $(cat /tmp/schizoid-client2.pid))"
        echo "Demo running ~${DURATION}s. Logs in .tmp/demo-*.log, screenshots .tmp/demo-p*.png"

  stop:
    desc: Kill running server and client
    cmds:
      - |
        for f in /tmp/schizoid-server.pid /tmp/schizoid-client.pid /tmp/schizoid-client2.pid; do
          if [ -f "$f" ]; then
            pid=$(cat "$f")
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
              echo "Killed PID $pid"
            fi
            rm -f "$f"
          fi
        done
        # Catch any stragglers
        pkill -f schizoid-server 2>/dev/null || true
        pkill -f schizoid-client 2>/dev/null || true
        echo "Stopped"
